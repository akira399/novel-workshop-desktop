<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 主渐变：深棕到暖琥珀 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#44403c"/>
    </linearGradient>
    <!-- 强调渐变：琥珀金 -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- 光泽渐变 -->
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <!-- 阴影 -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 圆角背景方块 -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- 光泽层 -->
  <rect x="16" y="16" width="480" height="240" rx="96" ry="96" fill="url(#shine)" opacity="0.5"/>

  <!-- 笔尖图形 -->
  <g transform="translate(256,220)">
    <!-- 笔尖主体 -->
    <path d="M0,-120 L40,60 L0,120 L-40,60 Z" fill="url(#accent)" opacity="0.95"/>
    <!-- 笔尖高光 -->
    <path d="M0,-120 L20,30 L0,60 L-20,30 Z" fill="rgba(255,255,255,0.2)"/>
    <!-- 墨滴 -->
    <circle cx="0" cy="140" r="12" fill="url(#accent)"/>
  </g>

  <!-- 书页线条 -->
  <g transform="translate(256,220)" opacity="0.3">
    <line x1="-80" y1="80" x2="80" y2="80" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <line x1="-60" y1="95" x2="60" y2="95" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <line x1="-40" y1="110" x2="40" y2="110" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 底部文字 -->
  <text x="256" y="420" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="36" font-weight="700" fill="#f5f5f4" letter-spacing="2">
    小说工坊
  </text>
</svg>
